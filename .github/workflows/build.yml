name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version

      - name: Build app + DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./scripts/build-app.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Snippy-dmg
          path: build/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true
