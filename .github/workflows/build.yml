name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as the latest release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      # Every push to main (or a manual run with "publish") becomes the latest downloadable release.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat VERSION).${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app + DMG
        run: ./scripts/build-app.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Snippy-${{ steps.version.outputs.version }}
          path: build/Snippy.dmg
          if-no-files-found: error

      - name: Publish release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Snippy ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            **Install or update:** `curl -fsSL https://raw.githubusercontent.com/natentate/Snippy/main/scripts/install.sh | bash`

            Or download `Snippy.dmg` below and drag Snippy to Applications.
          files: |
            build/Snippy.dmg
            build/Snippy-${{ steps.version.outputs.version }}.dmg
